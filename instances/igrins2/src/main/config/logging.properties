# JUL configuration for the IGRINS2 GMP instance.
# Carries over the old pax-logging override: TRACE root level and a fixed log
# file location under /usr/local/share/gmp-server.

handlers = edu.gemini.aspen.gmp.main.logging.DailyRollingFileHandler

.level = FINEST

edu.gemini.aspen.gmp.main.logging.DailyRollingFileHandler.pattern = /usr/local/share/gmp-server/gmp.log
edu.gemini.aspen.gmp.main.logging.DailyRollingFileHandler.formatter = edu.gemini.aspen.gmp.main.logging.GmpLogFormatter
edu.gemini.aspen.gmp.main.logging.DailyRollingFileHandler.level = ALL

# Per-logger levels carried over from the old org.ops4j.pax.logging.cfg
edu.gemini.aspen.gds.level = INFO
net.jini.level = OFF
org.apache.activemq.level = INFO
javax.management.level = INFO
sun.rmi.level = INFO
java.io.level = INFO
edu.gemini.aspen.gmp.epics.jms.level = INFO
edu.gemini.aspen.gmp.statusservice.level = INFO
com.cosylab.level = INFO
