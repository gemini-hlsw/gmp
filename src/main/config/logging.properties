# JUL configuration for GMP, replacing the pax-logging/log4j setup.
# The handler and formatter reproduce the old DailyRollingFileAppender
# behavior and the "%d %-5p [%t] %40.40c - %x %m%n" pattern.

handlers = edu.gemini.aspen.gmp.main.logging.DailyRollingFileHandler

.level = INFO

edu.gemini.aspen.gmp.main.logging.DailyRollingFileHandler.pattern = ${logs.dir}/gmp.log
edu.gemini.aspen.gmp.main.logging.DailyRollingFileHandler.formatter = edu.gemini.aspen.gmp.main.logging.GmpLogFormatter
edu.gemini.aspen.gmp.main.logging.DailyRollingFileHandler.level = ALL

# Per-logger levels carried over from the old org.ops4j.pax.logging.cfg
edu.gemini.aspen.gds.level = INFO
edu.gemini.aspen.gmp.tcsoffset.level = FINE
net.jini.level = OFF
org.apache.activemq.level = INFO
com.cosylab.level = INFO
